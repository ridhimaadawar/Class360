<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #2C3E50; 
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            max-height: 700px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-form label {
            font-size: 14px;
            color: #555;
        }

        .login-form input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .login-form input:focus {
            outline: none;
            border-color: #4169E1;
        }

        .login-form button {
            padding: 10px;
            font-size: 16px;
            background-color: #4169E1;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-form button:hover {
            background-color: #27408b;
        }

        .forgot-password {
            text-align: center;
            margin-top: 10px;
        }

        .forgot-password a {
            color: #4169E1;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        @media (max-width: 400px) {
            .login-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form class="login-form" method="post" onsubmit="handleLogin(event)">
            <label for="student-id">Student ID:</label>
            <input type="text" id="student-id" name="student-id" placeholder="Enter your Student ID" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            
            <button type="submit">Login</button>
        </form>
        <div class="forgot-password">
            <a href="#" onclick="forgotPassword()">Forgot Password?</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
    
            const studentId = document.getElementById('student-id').value;
            const password = document.getElementById('password').value;
    
            if (studentId && password) {
                window.location.href = "file:///C:/Users/kabee/OneDrive/Desktop/Ri/class360/templates/dashboard.html"; // Replace with your actual URL
            } else {
                alert("Please enter your Student ID and password.");
            }
        }

        function forgotPassword() {
            alert("Please contact the administrator for password assistance.");
        }
    </script>
</body>
</html>
